<!-- pop.html -->
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Status dos POPs - Monitoramento</title>
    
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="pop.css">
</head>
<body>

    <div class="page-container">
        <div id="header-placeholder"></div>

        <main class="main-content" style="flex-direction: column;">
            <div id="pop-grid" class="grid-container" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; width: 100%;">
            </div>
        </main>
    </div>

    <div id="pop-modal" class="modal-overlay" style="display: none;" onclick="closePopModal(event)">
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="pop-modal-title" style="margin: 0; display: flex; align-items: center; gap: 8px;">
                    <span class="material-symbols-rounded">domain</span> Detalhes do POP
                </h3>
                <button class="close-modal" onclick="closePopModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="table-container">
                    <table class="noc-table">
                        <thead>
                            <tr class="table-header-row">
                                <th style="text-align: left;">OLT</th>
                                <th>TOTAL</th>
                                <th>ONLINE</th>
                                <th>OFFLINE</th>
                                <th>ENERGIA</th>
                                <th>POTÊNCIA</th>
                                <th>TEMP.</th>
                            </tr>
                        </thead>
                        <tbody id="pop-detalhes-tbody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <div id="hibrido-offscreen-container" style="position: absolute; top: -9999px; left: -9999px; width: 210mm; background-color: #ffffff; color: var(--m3-primary);"></div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="config.js"></script>
    <script src="api-service.js"></script>
    <script src="data-mapper.js"></script>
    <script src="data-store.js"></script>
    <script src="layout.js"></script>
    <script src="notifications.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
    <script src="olt-relatorio.js"></script>
    <script src="olt-comunicado.js"></script>
    <script src="energia-relatorio.js"></script>
    <script src="relatorio-pdf.js"></script>
    
    <script src="energia-engine.js"></script>
    <script src="temperatura-engine.js"></script>
    <script src="pop-engine.js"></script>
    <script src="boletim-gerencial.js"></script>
    <script src="relatorio-hibrido.js"></script> 
</body>
</html>
